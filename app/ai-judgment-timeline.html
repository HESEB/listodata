<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Judgment Timeline | HESEB</title><style>
body{margin:0;background:#f5fafc;color:#182231;font-family:system-ui,-apple-system,Segoe UI,Noto Sans KR,sans-serif}main{max-width:1180px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px}.top a{color:#182231;text-decoration:none;border:1px solid #dce5ec;background:#fff;padding:8px 11px;border-radius:999px;font-size:12px}.hero,.card{background:#fff;border:1px solid #dce5ec;border-radius:20px;padding:16px;margin-top:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}.sub{font-size:12px;color:#687486;line-height:1.55}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;background:#eef4ff;margin-right:4px}.critical{background:#ffe6eb;color:#a91f3d}.warning{background:#fff3d8;color:#8a5b00}.info{background:#e9f2ff;color:#245ca8}.event{border-left:3px solid #d8e2ec;padding:4px 0 12px 12px;margin-top:8px}.event h3{margin:4px 0;font-size:14px}.metric{display:flex;justify-content:space-between;border-top:1px solid #edf1f4;padding:7px 0;font-size:12px}.empty{padding:20px;text-align:center;color:#687486}</style></head><body><main>
<div class="top"><div><h1>AI Judgment 변화 타임라인</h1><div class="sub">Phase 7-3 · 판단 전환·품질 변화 알림</div></div><div><a href="./ai-judgment.html">AI 종합판단</a> <a href="./main.html">Dashboard</a></div></div>
<section class="hero"><h2>현재 알림</h2><div id="summary" class="sub">불러오는 중...</div></section>
<section class="grid"><article class="card"><h2>판단 전환 알림</h2><div id="alerts"></div></article><article class="card"><h2>실행별 타임라인</h2><div id="timeline"></div></article></section>
</main><script>
const e=s=>String(s??'-').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
Promise.all([fetch('./data/analysis/ai_judgment_alerts.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()),fetch('./data/history/ai_judgment_history.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json())]).then(([a,h])=>{
document.getElementById('summary').textContent=`Critical ${a.summary?.critical||0} · Warning ${a.summary?.warning||0} · Info ${a.summary?.info||0} · 이력 ${a.history_snapshots||0}회`;
document.getElementById('alerts').innerHTML=(a.alerts||[]).map(x=>`<div class="event"><span class="badge ${e(x.severity)}">${e(x.severity).toUpperCase()}</span><h3>${e(x.headline)}</h3><div class="sub">${(x.reasons||[]).map(e).join(' · ')}</div><div class="metric"><b>현재</b><span>${e(x.current?.direction)} / ${e(x.current?.action)}</span></div><div class="metric"><b>신뢰도/커버리지</b><span>${e(x.current?.confidence)} / ${e(x.current?.coverage)}</span></div></div>`).join('')||'<div class="empty">현재 판단 변화 알림이 없습니다.</div>';
const items=(h.items||[]).slice().reverse();document.getElementById('timeline').innerHTML=items.map(s=>`<div class="event"><h3>${e(s.timestamp)}</h3><div class="sub">READY ${s.summary?.ready_count||0} · HOLD ${s.summary?.hold_count||0} · 변화 ${s.summary?.changed_count||0}</div>${(s.species||[]).filter(x=>x.change?.changed).map(x=>`<div class="metric"><b>${e(x.label)}</b><span>${(x.change?.reasons||[]).map(e).join(' / ')}</span></div>`).join('')}</div>`).join('')||'<div class="empty">아직 누적 이력이 없습니다.</div>';
}).catch(err=>document.getElementById('summary').textContent='로드 실패: '+err);
</script></body></html>
