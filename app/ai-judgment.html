<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Judgment | HESEB</title><style>
body{margin:0;background:#f5fafc;color:#182231;font-family:system-ui,-apple-system,Segoe UI,Noto Sans KR,sans-serif}main{max-width:1180px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.top a{color:#182231;text-decoration:none;border:1px solid #dce5ec;background:#fff;padding:8px 11px;border-radius:999px;font-size:12px}.hero,.card{background:#fff;border:1px solid #dce5ec;border-radius:20px;padding:16px;margin-top:12px;box-shadow:0 8px 24px rgba(18,28,40,.06)}.hero{background:linear-gradient(145deg,#fff,#f4f8ff)}h1,h2{margin:0}.sub{color:#687486;font-size:12px;line-height:1.55;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:12px}.badge{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;background:#eef4ff;margin-right:5px}.hold{background:#fff3d8}.ready{background:#e8f7ef}.kv{display:flex;justify-content:space-between;border-top:1px solid #edf1f4;padding:8px 0;font-size:13px}.kv:first-of-type{border-top:0}.reason{font-size:13px;line-height:1.55;margin-top:8px}.signals{font-size:12px;color:#566273;margin-top:8px;padding-left:18px}.warn{background:#fff8e8;border:1px solid #f1ddb2;border-radius:12px;padding:10px;font-size:12px;line-height:1.5;margin-top:10px}</style></head><body><main>
<div class="top"><div><h1>AI Judgment Layer</h1><div class="sub">Phase 7 · 설명 가능한 DSS 종합판단</div></div><div><a href="./main.html">Dashboard</a> <a href="./reasoning.html">종합판단근거</a></div></div>
<section class="hero"><h2>시장 판단 종합</h2><div class="sub" id="summary">불러오는 중...</div><div class="warn">이 페이지의 “AI Judgment”는 생성형 AI가 임의로 확률을 만드는 기능이 아닙니다. 공식 수치 기반 Direction Engine의 HOLD 게이트를 우선하며, Evidence·Conflict·History를 설명용으로 합성합니다.</div></section>
<section class="grid" id="cards"></section>
</main><script>
const e=s=>String(s??'-').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
fetch('./data/analysis/ai_judgment.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{document.getElementById('summary').textContent=`READY ${d.summary?.ready_count||0} · HOLD ${d.summary?.hold_count||0} · ${d.updated_at||'-'}`;document.getElementById('cards').innerHTML=(d.species||[]).map(x=>`<article class="card"><div><span class="badge ${x.judgment_status==='hold'?'hold':'ready'}">${x.judgment_status==='hold'?'판단 유보':'판단 가능'}</span><span class="badge">신뢰도 ${e(x.confidence_score)}</span><span class="badge">커버리지 ${e(x.coverage_score)}</span></div><h2 style="margin-top:9px">${e(x.headline)}</h2><div class="reason">${e(x.explanation)}</div><div class="kv"><b>시장방향</b><span>${e(x.direction_label)}</span></div><div class="kv"><b>구매행동</b><span>${e(x.recommended_action)}</span></div><div class="kv"><b>충돌</b><span>${e(x.conflict?.severity)}</span></div>${(x.hold_reasons||[]).length?`<div class="warn"><b>유보 사유</b><br>${x.hold_reasons.map(e).join('<br>')}</div>`:''}<ul class="signals">${(x.key_signals||[]).map(s=>`<li>${e(s.name)}: ${e(s.signal)} · ${e(s.reason)}</li>`).join('')}</ul><div class="sub">${e(x.history_context)}</div></article>`).join('')}).catch(err=>{document.getElementById('summary').textContent='ai_judgment.json 로드 실패: '+err});
</script></body></html>
